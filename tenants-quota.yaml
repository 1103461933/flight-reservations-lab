apiVersion: v1
kind: ResourceQuota
metadata:
  name: flink-indigo-quota
  namespace: flink-indigo
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    requests.storage: 30Gi
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: flink-tui-quota
  namespace: flink-tui
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    requests.storage: 30Gi
    persistentvolumeclaims: "5"