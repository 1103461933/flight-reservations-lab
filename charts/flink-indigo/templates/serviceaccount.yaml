apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.flink.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  annotations:
    azure.workload.identity/client-id: {{ required "Set azure.clientId in values.yaml to the tenant-specific managed identity client ID" .Values.azure.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "Set azure.tenantId in values.yaml to the Azure tenant ID" .Values.azure.tenantId | quote }}
