# Couchbase resources exclusivos para Indigo.
# Integrar en charts/flink-indigo/templates/couchbase-bucket.yaml
# y sincronizar mediante Argo CD. No aplicar manualmente si Argo CD administra el chart.
# Los nombres de las collections llevan sufijo -indigo para evitar colisiones
# con los CRs de TUI en el mismo namespace.
---
apiVersion: couchbase.com/v2
kind: CouchbaseBucket
metadata:
  name: flight-reservations-indigo
  namespace: stratos-rnd-dev
spec:
  memoryQuota: 128Mi
  replicas: 0
  enableFlush: false
  evictionPolicy: fullEviction
  compressionMode: passive
  scopes:
    managed: true
    resources:
      - kind: CouchbaseScope
        name: reservations-indigo
---
apiVersion: couchbase.com/v2
kind: CouchbaseCollection
metadata:
  name: bookings-indigo
  namespace: stratos-rnd-dev
spec:
  maxTTL: "0"
---
apiVersion: couchbase.com/v2
kind: CouchbaseCollection
metadata:
  name: processed-indigo
  namespace: stratos-rnd-dev
spec:
  maxTTL: "0"
---
apiVersion: couchbase.com/v2
kind: CouchbaseScope
metadata:
  name: reservations-indigo
  namespace: stratos-rnd-dev
spec:
  collections:
    managed: true
    resources:
      - kind: CouchbaseCollection
        name: bookings-indigo
      - kind: CouchbaseCollection
        name: processed-indigo
