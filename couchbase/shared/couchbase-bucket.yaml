apiVersion: couchbase.com/v2
kind: CouchbaseBucket
metadata:
  name: flight-reservations
  namespace: stratos-rnd-dev
spec:
  memoryQuota: 256Mi
  replicas: 0
  enableFlush: false
  evictionPolicy: fullEviction
  compressionMode: passive
  scopes:
    managed: true
    resources:
      - kind: CouchbaseScope
        name: reservations