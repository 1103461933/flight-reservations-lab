apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: flight-kafka
  namespace: stratos-rnd-dev
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled

spec:
  kafka:
    version: 4.3.1

    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false

      - name: tls
        port: 9093
        type: internal
        tls: true

    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1

  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 512Mi

    userOperator:
      livenessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 5
        periodSeconds: 10
        failureThreshold: 3

      readinessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 5
        periodSeconds: 10
        failureThreshold: 3

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 512Mi