apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: stratos-rnd-dev
  labels:
    strimzi.io/cluster: flight-kafka
spec:
  replicas: 1

  roles:
    - controller
    - broker

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        class: managed-csi
        deleteClaim: false