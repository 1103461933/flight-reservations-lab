name: Build and Push Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 1.19.3-pyflink-tenants-1)"
        required: true
        default: "1.0.1"
        type: string

      update_legacy_flink:
        description: "Also update the legacy Flink deployment image"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # --------------------------------------------------
  # 1. Validate input tag
  # --------------------------------------------------
  validate-tag:
    name: Validate image tag
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag format
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "ERROR: Invalid Docker image tag: $IMAGE_TAG"
            exit 1
          fi

          echo "Image tag validated: $IMAGE_TAG"

  # --------------------------------------------------
  # 2. Build and push Flink image
  # --------------------------------------------------
  build-flink:
    name: Build Flink image
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Flink Dockerfile and application
        run: |
          set -euo pipefail

          test -f application/flink/Dockerfile
          test -f application/flink/requirements.txt
          test -f application/flink/src/flight_reservations.py
          test -f flink/flink-azure-fs-hadoop-1.19.3.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Flink image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./application/flink/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flink-azure:${{ inputs.tag }}

  # --------------------------------------------------
  # 3. Build and push producer image
  # --------------------------------------------------
  build-producer:
    name: Build Producer image
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Producer Dockerfile
        run: |
          set -euo pipefail

          test -f application/producer/Dockerfile
          test -f application/producer/requirements.txt
          test -f application/producer/src/producer.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Producer image
        uses: docker/build-push-action@v6
        with:
          context: ./application/producer
          file: ./application/producer/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flight-reservation-producer:${{ inputs.tag }}

  # --------------------------------------------------
  # 4. Build and push validator image
  # --------------------------------------------------
  build-validator:
    name: Build Validator image
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Validator Dockerfile
        run: |
          set -euo pipefail

          test -f application/validator/Dockerfile
          test -f application/validator/validator.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Validator image
        uses: docker/build-push-action@v6
        with:
          context: ./application/validator
          file: ./application/validator/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flight-reservations-validator:${{ inputs.tag }}

  # --------------------------------------------------
  # 5. Update Kubernetes, Helm and Argo Workflows manifests
  # --------------------------------------------------
  update-manifests:
    name: Update image tags in manifests
    needs:
      - build-flink
      - build-producer
      - build-validator

    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.tag }}
          UPDATE_LEGACY_FLINK: ${{ inputs.update_legacy_flink }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          username = os.environ["DOCKERHUB_USERNAME"]
          tag = os.environ["IMAGE_TAG"]
          update_legacy = (
              os.environ.get("UPDATE_LEGACY_FLINK", "false").lower()
              == "true"
          )

          # Legacy deployment is intentionally excluded by default.
          image_manifests = {
              "argo-workflows/integration-test-workflow-template.yaml": (
                  "flight-reservation-producer",
                  "flight-reservations-validator",
              ),
          }

          if update_legacy:
              image_manifests["flink/flink-deployment.yaml"] = (
                  "flink-azure",
              )

          # These charts use a nested Helm values structure:
          #
          # flink:
          #   image:
          #     repository: xlen911/flink-azure
          #     tag: "..."
          #
          # Update only flink.image.tag, not unrelated tags.
          helm_values = (
              "charts/flink-indigo/values.yaml",
              "charts/flink-tui/values.yaml",
          )

          modified_files = []

          def update_image_manifest(filename, expected_images):
              path = Path(filename)

              if not path.is_file():
                  sys.exit(f"ERROR: Manifest not found: {filename}")

              text = path.read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)

              updated_lines = []
              counts = {name: 0 for name in expected_images}

              for line in lines:
                  updated = line

                  if re.match(r"^\s*image\s*:", line):
                      for image_name in expected_images:
                          pattern = (
                              r"(^\s*image\s*:\s*)"
                              r"(?:\S*/)?"
                              + re.escape(image_name)
                              + r":[^\s#]+"
                          )

                          def replace_image(match):
                              return (
                                  match.group(1)
                                  + f"{username}/{image_name}:{tag}"
                              )

                          updated, count = re.subn(
                              pattern,
                              replace_image,
                              updated,
                          )

                          counts[image_name] += count

                  updated_lines.append(updated)

              missing = [
                  name for name, count in counts.items()
                  if count == 0
              ]

              if missing:
                  sys.exit(
                      f"ERROR: No image reference found for {missing} "
                      f"in {filename}. Check the manifest."
                  )

              new_text = "".join(updated_lines)

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  modified_files.append(filename)

              print(f"Updated {filename}: {counts}")

          def update_helm_values(filename):
              path = Path(filename)

              if not path.is_file():
                  sys.exit(f"ERROR: Helm values not found: {filename}")

              text = path.read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)

              updated_lines = []
              in_flink = False
              in_image = False
              repository_found = False
              tag_count = 0

              for line in lines:
                  stripped = line.lstrip()
                  indent = len(line) - len(stripped)

                  # Detect a top-level YAML key.
                  if indent == 0 and stripped.strip():
                      in_flink = bool(
                          re.match(r"^flink\s*:", stripped)
                      )
                      in_image = False

                  elif in_flink and indent == 2:
                      in_image = bool(
                          re.match(r"^image\s*:", stripped)
                      )

                  if in_flink and in_image and indent == 4:
                      if re.match(r"^repository\s*:", stripped):
                          repository_found = bool(
                              re.match(
                                  r"^repository\s*:\s*"
                                  + re.escape(username)
                                  + r"/flink-azure\s*(?:#.*)?$",
                                  stripped.rstrip("\r\n"),
                              )
                          )

                      if re.match(r"^tag\s*:", stripped):
                          newline = (
                              "\r\n" if line.endswith("\r\n")
                              else "\n" if line.endswith("\n")
                              else ""
                          )

                          prefix = line[:indent] + "tag: "
                          updated_lines.append(
                              prefix + f'"{tag}"' + newline
                          )
                          tag_count += 1
                          continue

                  updated_lines.append(line)

              if not repository_found:
                  sys.exit(
                      f"ERROR: Expected repository "
                      f"{username}/flink-azure not found under "
                      f"flink.image in {filename}."
                  )

              if tag_count != 1:
                  sys.exit(
                      f"ERROR: Expected exactly one flink.image.tag "
                      f"in {filename}; found {tag_count}."
                  )

              new_text = "".join(updated_lines)

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  modified_files.append(filename)

              print(
                  f"Updated {filename}: "
                  f"repository={username}/flink-azure, tag={tag}"
              )

          for filename, expected_images in image_manifests.items():
              update_image_manifest(filename, expected_images)

          for filename in helm_values:
              update_helm_values(filename)

          if update_legacy:
              print("Legacy Flink deployment image update enabled.")
          else:
              print(
                  "Legacy Flink deployment unchanged. "
                  "Set update_legacy_flink=true to update it."
              )

          print("Files modified:", modified_files)
          PY

      - name: Review manifest changes
        env:
          UPDATE_LEGACY_FLINK: ${{ inputs.update_legacy_flink }}
        run: |
          set -euo pipefail

          git diff --check
          git diff -- \
            charts/flink-indigo/values.yaml \
            charts/flink-tui/values.yaml \
            argo-workflows/integration-test-workflow-template.yaml

          if [[ "$UPDATE_LEGACY_FLINK" == "true" ]]; then
            git diff -- flink/flink-deployment.yaml
          fi

      - name: Commit and push manifest changes
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          UPDATE_LEGACY_FLINK: ${{ inputs.update_legacy_flink }}
        run: |
          set -euo pipefail

          files=(
            charts/flink-indigo/values.yaml
            charts/flink-tui/values.yaml
            argo-workflows/integration-test-workflow-template.yaml
          )

          if [[ "$UPDATE_LEGACY_FLINK" == "true" ]]; then
            files+=(flink/flink-deployment.yaml)
          fi

          if git diff --quiet -- "${files[@]}"; then
            echo "No manifest changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${files[@]}"

          git commit -m "chore: update image tags to ${IMAGE_TAG}"
          git push