apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: stratos-rnd-dev
  namespace: argocd
spec:
  description: "Flight reservations lab — GitOps development environment"

  sourceRepos:
    - "https://github.com/1103461933/flight-reservations-lab.git"
    

  destinations:
    - server: https://kubernetes.default.svc
      namespace: stratos-rnd-dev

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"