apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: stratos-rnd-dev
  namespace: argocd
spec:
  description: "Flight reservations lab — GitOps"
  sourceRepos:
    - "https://github.com/<ORG>/flight-reservations-lab.git"
  destinations:
    - namespace: stratos-rnd-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"