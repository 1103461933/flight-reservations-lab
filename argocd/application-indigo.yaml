apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-indigo
  namespace: argocd
spec:
  project: flight-reservations-tenants
  source:
    repoURL: "https://github.com/1103461933/flight-reservations-lab.git"
    targetRevision: main
    path: charts/flink-indigo
    helm:
      releaseName: flink-indigo
  destination:
    server: https://kubernetes.default.svc
    namespace: flink-indigo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Prune=false
